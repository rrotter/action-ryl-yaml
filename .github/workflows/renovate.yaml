name: Renovate
on:
  schedule: [cron: 0 6 * * 1]
  workflow_dispatch: {}
permissions: {}
jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    ### uncomment to use PAT
    # environment: Renovate
    # permissions:
    #   contents: read
    ###
    ### delete this permissions block
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Run Renovate
      uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776 # v46.3.10
      env:
        RENOVATE_PLATFORM: github
        RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'
        # uncomment this
        # RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        # delete this
        RENOVATE_TOKEN: ${{ github.token }}
        LOG_LEVEL: ${{ runner.debug == '1' && 'debug' || 'info' }}
