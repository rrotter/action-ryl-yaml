name: ryl-yaml
description: Lint yaml files
inputs:
  enforce_extension:
    description: Shall we error if the file extension `.yml` is used? Defaults to `true`.
    type: boolean
    required: false
    default: true
runs:
  using: composite
  steps:
  - name: Check yaml file extension
    shell: bash
    if: ${{ inputs.enforce_extension == 'true' }}
    run: |
      files=$(git ls-files '*.yml')
      if [ -n "$files" ]; then
        echo "::error::Use the .yaml extension instead of .yml for:"
        echo "$files"
        exit 1
      fi
  - name: Fail on unsupported runner
    if: |-
      ${{ !((runner.os == 'macOS' && runner.arch == 'ARM64') ||
            (runner.os == 'Linux' && runner.arch == 'ARM64') ||
            (runner.os == 'Linux' && runner.arch == 'X64')) }}
    shell: bash
    run: |
      echo "Unsupported runner: os=${{ runner.os }} arch=${{ runner.arch }}"
      exit 1
  - name: Install ryl (x64)
    if: runner.arch == 'X64' && runner.os == 'Linux'
    uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
    with:
      repo: owenlamont/ryl
      tag: v0.28.0
      digest: 6e0ae1db5dc9b3b3f7c389eca845b3665eee72e3a400eea32155ccc36b27469d
  - name: Install ryl (arm64)
    if: runner.arch == 'ARM64' && runner.os == 'Linux'
    uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
    with:
      repo: owenlamont/ryl
      tag: v0.28.0
      digest: 8a4d3f7ea93bd5cf96d1a1d49732869c26e7ac126e38811d6650b53d1656ccba
  - name: Install ryl (macOS)
    if: runner.os == 'macOS'
    uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
    with:
      repo: owenlamont/ryl
      tag: v0.28.0
      digest: a1120c6b6974bd63198eb2fd06cf8f220620d0aa3f4348634fbe7d04dd74c602
  - name: Lint yaml w/ ryl
    shell: bash
    run: ryl check "$GITHUB_WORKSPACE"
